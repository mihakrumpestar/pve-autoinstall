version: "3"

tasks:
  answers:
    desc: Build the answer files for the default config (result-answers/answers)
    cmds:
      - nix build .#pve-answers --out-link result-answers

  isos:
    desc: Build the prepared ISOs for the default config (result-isos/isos)
    cmds:
      - nix build .#pve-isos --out-link result-isos

  build:
    desc: Build both answer files and prepared ISOs
    cmds:
      - task: answers
      - task: isos

  check:
    desc: |
      Authoritative validation: `nix flake check` builds the answers and the
      prepared ISOs and runs the PVE tools (validate-answer, inspect-iso) plus
      the render/reject checks. Needs network for the pinned PVE ISO.
    cmds:
      - nix flake check

  run:
    desc: |
      Run the CLI against a config module. Examples:
        task run -- config/example.nix --answers-only
        task run -- ./hosts.nix -H pve01
      Full flag list: nix run . -- --help
    cmds:
      - nix run . -- {{.CLI_ARGS}}

  clean:
    desc: Remove build output symlinks and CLI results
    cmds:
      - rm -f result result-answers result-isos
      - rm -rf pve-result

  ci:
    desc: |
      Fast pre-commit gate (also the git hook): secret scan, format, lint and
      flake.lock check. No ISO builds, so it stays quick.
    cmds:
      - gitleaks git --redact --staged
      - gitleaks git --redact
      - treefmt --fail-on-change
      - deadnix --fail
      - statix check
      # flake-checker takes the flake.lock path positionally (not --flake).
      - flake-checker --no-telemetry --fail-mode {{.ROOT_DIR}}/flake.lock

  verify:
    desc: "`ci` plus `check`."
    deps:
      - ci
    cmds:
      - nix flake check

  test:
    desc: |
      Every check except the per-host validate-answer/inspect-iso ones, plus
      CLI argument-parsing tests. No ISO builds; `check` is the ISO-level
      validation.
    cmds:
      - |
        # Derived so new offline checks are picked up automatically.
        system=$(nix config show system)
        offline=$(nix eval --raw ".#checks.$system" \
          --apply "c: builtins.concatStringsSep \" \" (map (n: \".#checks.$system.\" + n) (builtins.filter (n: builtins.match \"pve-(answer-validates|iso-is-autoinstall)-.*\" n == null) (builtins.attrNames c)))")
        nix build --no-link $offline
      - PVE_CLI="$(nix build --no-link --print-out-paths .#pve-autoinstall)/bin/pve-autoinstall" bats tests/cli.bats

  update-inputs:
    desc: |
      Update flake inputs. Can also update a specific input with:
      task update-inputs -- <input-name>
    cmds:
      - nix flake update --flake 'path:{{.ROOT_DIR}}' {{.CLI_ARGS}}

  update-iso:
    desc: |
      Repin both PVE ISOs after a new release: set `version` in
      lib/iso-pins.nix (one bump covers both arches), then run this task. It
      derives both per-arch ISO URLs from the pin module, prefetches them and
      prints the two sha256 SRI hashes for the `sha256` fields.
    cmds:
      - |
        # The trailing "\n" matters: `read` drops a last line without one.
        nix eval --raw .#lib.pveIso --apply 'p: builtins.concatStringsSep "\n" (map (a: a + " " + p.urlFor a) (builtins.attrNames p.arches)) + "\n"' |
        while read -r arch url; do
          echo "# $arch $url"
          nix store prefetch-file --json --hash-type sha256 "$url"
        done
