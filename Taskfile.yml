version: "3"

tasks:
  answers:
    desc: Build the answer files for the default config (result-answers/answers)
    cmds:
      - nix build .#pve-answers --out-link result-answers

  isos:
    desc: Build the prepared ISOs for the default config (result-isos/isos)
    cmds:
      - nix build .#pve-isos --out-link result-isos

  build:
    desc: Build both answer files and prepared ISOs
    cmds:
      - task: answers
      - task: isos

  check:
    desc: |
      Authoritative validation: `nix flake check` builds the answers and the
      prepared ISOs and runs the PVE tools (validate-answer, inspect-iso) plus
      the render/reject checks. Needs network for the pinned PVE ISO.
    cmds:
      - nix flake check

  run:
    desc: |
      Run the CLI against a config module. Examples:
        task run -- config/example.nix --answers-only
        task run -- ./hosts.nix -H pve01
      Full flag list: nix run . -- --help
    cmds:
      - nix run . -- {{.CLI_ARGS}}

  clean:
    desc: Remove build output symlinks and CLI results
    cmds:
      - rm -f result result-answers result-isos
      - rm -rf pve-result

  ci:
    desc: |
      Fast pre-commit gate (also the git hook): secret scan, format, lint and
      flake.lock check. No ISO builds, so it stays quick.
    cmds:
      - gitleaks git --redact --staged
      - gitleaks git --redact
      - treefmt --fail-on-change
      - deadnix --fail
      - statix check
      # flake-checker takes the flake.lock path positionally (not --flake).
      - flake-checker --no-telemetry --fail-mode {{.ROOT_DIR}}/flake.lock

  verify:
    desc: "`ci` plus `check`."
    deps:
      - ci
    cmds:
      - nix flake check

  test:
    desc: |
      Render/reject checks, the docs pattern check and CLI argument-parsing
      tests. Does not build ISOs; `check` is the ISO-level validation.
    cmds:
      - nix build --no-link .#checks.x86_64-linux.pve-render-golden
      - nix build --no-link .#checks.x86_64-linux.pve-host-key-pattern-consistent
      # Reject-check names come from config/fixtures.nix; derive them so this
      # never drifts from the fixtures.
      - |
        rejects=$(nix eval --raw .#checks.x86_64-linux \
          --apply 'c: builtins.concatStringsSep " " (map (n: ".#checks.x86_64-linux." + n) (builtins.filter (n: builtins.match "pve-rejects-.*" n != null) (builtins.attrNames c)))')
        if [ -n "$rejects" ]; then nix build --no-link $rejects; fi
      - PVE_CLI="$(nix build --no-link --print-out-paths .#pve-autoinstall)/bin/pve-autoinstall" bats tests/cli.bats

  update-inputs:
    desc: |
      Update flake inputs. Can also update a specific input with:
      task update-inputs -- <input-name>
    cmds:
      - nix flake update --flake 'path:{{.ROOT_DIR}}' {{.CLI_ARGS}}

  update-iso:
    desc: |
      Repin the PVE ISO after a new release. Pass the new ISO URL to print the
      SRI hash for the `pveIso` pin in flake.nix (bump `version` alongside the
      hash; the URL is derived from `version`), or run with no URL for the
      manual steps:
        task update-iso -- https://enterprise.proxmox.com/iso/proxmox-ve_X.Y-Z.iso
    cmds:
      - |
        url={{.CLI_ARGS}}
        if [ -z "$url" ]; then
          echo "usage: task update-iso -- <ISO URL>"
          echo "manual: nix store prefetch-file --json --hash-type sha256 <URL>"
          echo "then edit flake.nix pveIso: set version and hash (url is derived)"
          exit 2
        fi
        nix store prefetch-file --json --hash-type sha256 "$url"
