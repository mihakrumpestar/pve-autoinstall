name: Update deps

# Weekly lock bump. Commits straight to main once the gate passes.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-deps
  cancel-in-progress: false

env:
  DO_NOT_TRACK: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Full history: the rebase in commit-push.sh must replay onto a moved main.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-deps-${{ hashFiles('flake.lock', 'devenv.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-lint-
          save: false

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: Update locks
        run: bash scripts/update-deps.sh

      # Same gate as ci.yml. A GITHUB_TOKEN push does not trigger ci.yml, so
      # nothing is committed unless this passes here.
      - name: Lint
        run: devenv --profile ci shell -- task ci

      - name: Commit and push
        run: |
          bash scripts/commit-push.sh "chore: update flake and devenv inputs" flake.lock devenv.lock
